site_name: GitHub Monitor
site_description: Python-based system for monitoring GitHub issues/PRs and processing events with Claude
site_url: https://github.com/tomzxcode/entity-manager
repo_name: tomzxcode/github-monitor
repo_url: https://github.com/tomzxcode/github-monitor
edit_uri: edit/main/docs/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tomzxcode/github-monitor

nav:
  - Home: index.md
  - Configuration: CONFIG.md
  - Specifications:
      - GitHub Monitoring: spec/github-monitoring.md
      - Event Handler: spec/event-handler.md
      - PR Comment System: spec/pr-comment-system.md
      - GitHub GraphQL Client: spec/github-graphql-client.md
      - CLI Interface: spec/cli-interface.md
      - Configuration Management: spec/configuration-management.md

theme:
  name: material
  font:
    text: Open Sans
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins:
  - search
  - social
