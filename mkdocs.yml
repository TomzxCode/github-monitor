site_name: GitHub Monitor
site_description: Python-based system for monitoring GitHub issues/PRs and processing events with Claude
site_author: github-monitor

nav:
  - Home: index.md
  - Configuration: CONFIG.md
  - Specifications:
      - GitHub Monitoring: spec/github-monitoring.md
      - Event Handler: spec/event-handler.md
      - PR Comment System: spec/pr-comment-system.md
      - GitHub GraphQL Client: spec/github-graphql-client.md
      - CLI Interface: spec/cli-interface.md
      - Configuration Management: spec/configuration-management.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
